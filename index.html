<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>i-Creativ Macro Pad</title>
  <style>
    :root {
      --bg: #121417;
      --surface: #1e2228;
      --border: #2c323d;
      --accent: #00e676;
      --text: #f0f3f6;
      --text-muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 1.3rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .status { font-size: 0.85rem; padding: 4px 10px; border-radius: 12px; background: #333; color: var(--text-muted); }
    .status.online { background: rgba(0, 230, 118, 0.15); color: var(--accent); }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card h2 { font-size: 1rem; margin-bottom: 12px; }

    /* Pad Grid */
    .pads-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .pad-btn {
      background: #282e38; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); aspect-ratio: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer;
      transition: background 0.1s, transform 0.05s;
    }
    .pad-btn.active { background: var(--accent); color: #000; transform: scale(0.96); }
    .pad-btn.mapped { border-color: var(--accent); }

    /* Mapping form */
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 8px 12px; background: #16191d; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.9rem;
    }
    .btn {
      padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #000;
    }
    .btn-secondary { background: #333a44; color: var(--text); margin-left: 8px; }
    
    #log { font-family: monospace; font-size: 0.75rem; color: var(--text-muted); height: 120px; overflow-y: auto; background: #0c0e10; padding: 8px; border-radius: 4px; margin-top: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>i-Creativ Macro Studio</h1>
    <div id="midi-status" class="status">In attesa di controller MIDI...</div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Pannello Pad i-Creativ (1-8)</h2>
      <div class="pads-grid" id="pads-container"></div>
      <div id="log">Monitor eventi MIDI in arrivo...</div>
    </div>

    <div class="card">
      <h2>Editor Tasti Rapidi</h2>
      <div class="form-group">
        <label>Profilo Applicazione</label>
        <select id="profile-select">
          <option value="default">Default / Desktop</option>
          <option value="photoshop">Photoshop</option>
          <option value="browser">Browser Web</option>
        </select>
      </div>

      <div class="form-group">
        <label>Controllo MIDI Selezionato</label>
        <input type="text" id="selected-control" readonly value="Premi un tasto sull'i-Creativ">
      </div>

      <div class="form-group">
        <label>Scorciatoia o Comando da simulare</label>
        <input type="text" id="target-hotkey" placeholder="Es: CTRL+Z oppure WIN+D">
      </div>

      <button class="btn" id="save-map-btn">Salva Mappatura</button>
      <button class="btn btn-secondary" id="export-btn">Esporta JSON</button>
    </div>
  </div>

  <script>
    // 1. Pulizia totale vecchi registri e service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    let mappings = JSON.parse(localStorage.getItem('icreativ_maps') || '{}');
    let currentControlKey = null;

    // 2. Inizializzazione Pad Virtuali
    const padsContainer = document.getElementById('pads-container');
    for (let i = 0; i < 8; i++) {
      const btn = document.createElement('button');
      btn.className = 'pad-btn';
      btn.id = `pad-${36 + i}`;
      btn.innerHTML = `<strong>Pad ${i + 1}</strong><span>Note ${36 + i}</span>`;
      padsContainer.appendChild(btn);
    }

    // 3. Web MIDI Nativo
    function initMIDI() {
      if (!navigator.requestMIDIAccess) {
        document.getElementById('midi-status').textContent = 'Web MIDI non supportato';
        return;
      }

      navigator.requestMIDIAccess({ sysex: true }).then(
        (midiAccess) => {
          function scan() {
            const inputs = Array.from(midiAccess.inputs.values());
            if (inputs.length > 0) {
              inputs.forEach(input => {
                input.onmidimessage = handleMIDIMessage;
              });
              document.getElementById('midi-status').textContent = `Connesso: ${inputs[0].name}`;
              document.getElementById('midi-status').classList.add('online');
              log(`Dispositivo pronto: ${inputs[0].name}`);
            } else {
              document.getElementById('midi-status').textContent = 'Nessun controller collegato';
              document.getElementById('midi-status').classList.remove('online');
            }
          }

          scan();
          midiAccess.onstatechange = () => scan();
        },
        () => {
          document.getElementById('midi-status').textContent = 'Permesso MIDI negato';
        }
      );
    }

    // 4. Gestione Messaggi
    function handleMIDIMessage(event) {
      const [status, data1, data2] = event.data;
      const cmd = status >> 4;

      let keyId = null;
      if (cmd === 9 && data2 > 0) {
        keyId = `note_${data1}`;
        visualFeedback(data1, true);
      } else if (cmd === 8 || (cmd === 9 && data2 === 0)) {
        visualFeedback(data1, false);
        return;
      } else if (cmd === 11) {
        keyId = `cc_${data1}`;
      }

      if (keyId) {
        currentControlKey = keyId;
        document.getElementById('selected-control').value = `${keyId} (Valore: ${data2})`;
        log(`MIDI In: [${keyId}] Valore: ${data2}`);
      }
    }

    function visualFeedback(note, active) {
      const el = document.getElementById(`pad-${note}`);
      if (el) {
        if (active) el.classList.add('active');
        else el.classList.remove('active');
      }
    }

    function log(msg) {
      const l = document.getElementById('log');
      l.innerHTML = `> ${msg}<br>` + l.innerHTML;
    }

    // Avvio
    initMIDI();
  </script>
</body>
</html>
