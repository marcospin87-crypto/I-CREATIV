<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>i-Creativ Macro Pad</title>
  <style>
    :root {
      --bg: #121417;
      --surface: #1e2228;
      --border: #2c323d;
      --accent: #00e676;
      --text: #f0f3f6;
      --text-muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 1.3rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .status { font-size: 0.85rem; padding: 4px 10px; border-radius: 12px; background: #333; color: var(--text-muted); }
    .status.online { background: rgba(0, 230, 118, 0.15); color: var(--accent); }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card h2 { font-size: 1rem; margin-bottom: 12px; }

    .pads-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .pad-btn {
      background: #282e38; border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); aspect-ratio: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer;
      transition: background 0.1s, transform 0.05s;
    }
    .pad-btn.active { background: var(--accent); color: #000; transform: scale(0.96); }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 8px 12px; background: #16191d; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.9rem;
    }
    .btn {
      padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer;
      background: var(--accent); color: #000;
    }
    .btn-secondary { background: #333a44; color: var(--text); margin-left: 8px; }
    
    #log { font-family: monospace; font-size: 0.75rem; color: var(--text-muted); height: 140px; overflow-y: auto; background: #0c0e10; padding: 8px; border-radius: 4px; margin-top: 12px; line-height: 1.5; }
  </style>
</head>
<body>

  <header>
    <h1>i-Creativ Macro Studio</h1>
    <div id="midi-status" class="status">In attesa...</div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Pannello Pad i-Creativ (1-8)</h2>
      <div class="pads-grid" id="pads-container"></div>
      <div id="log">Monitor eventi attivo...</div>
    </div>

    <div class="card">
      <h2>Editor Tasti Rapidi</h2>
      <div class="form-group">
        <label>Controllo MIDI Ricevuto</label>
        <input type="text" id="selected-control" readonly value="Premi un pad per testare">
      </div>

      <div class="form-group">
        <label>Scorciatoia o Testo</label>
        <input type="text" id="target-hotkey" placeholder="Es: CTRL+C o Salva">
      </div>

      <button class="btn" id="save-map-btn">Salva</button>
      <button class="btn btn-secondary" onclick="document.getElementById('log').innerHTML=''">Pulisci Log</button>
    </div>
  </div>

  <script>
    const padsContainer = document.getElementById('pads-container');
    for (let i = 0; i < 8; i++) {
      const btn = document.createElement('button');
      btn.className = 'pad-btn';
      btn.id = `pad-index-${i}`;
      btn.innerHTML = `<strong>Pad ${i + 1}</strong><span id="note-label-${i}">-</span>`;
      padsContainer.appendChild(btn);
    }

    function initMIDI() {
      if (!navigator.requestMIDIAccess) {
        document.getElementById('midi-status').textContent = 'Web MIDI non supportato';
        return;
      }

      navigator.requestMIDIAccess({ sysex: true }).then(
        (midiAccess) => {
          function setupInputs() {
            const inputs = Array.from(midiAccess.inputs.values());
            if (inputs.length > 0) {
              const names = inputs.map(i => i.name).join(' + ');
              document.getElementById('midi-status').textContent = `Connesso: ${names}`;
              document.getElementById('midi-status').classList.add('online');
              
              inputs.forEach((input) => {
                log(`Ascolto attivo su porta: [${input.name}]`);
                input.onmidimessage = (event) => handleIncoming(event, input.name);
              });
            } else {
              document.getElementById('midi-status').textContent = 'Nessun controller collegato';
              document.getElementById('midi-status').classList.remove('online');
            }
          }

          setupInputs();
          midiAccess.onstatechange = setupInputs;
        },
        () => {
          document.getElementById('midi-status').textContent = 'Permesso negato';
        }
      );
    }

    function handleIncoming(event, portName) {
      const data = Array.from(event.data);
      const [status, data1, data2] = data;
      const cmd = status >> 4;
      const channel = (status & 0x0F) + 1;

      let msgDesc = `Porta: ${portName} | Byte: [${data.join(', ')}] | Ch: ${channel}`;

      if (cmd === 9 && data2 > 0) {
        msgDesc += ` -> NOTA ON: ${data1} (Vel: ${data2})`;
        document.getElementById('selected-control').value = `Nota ${data1} (Ch ${channel})`;
        triggerVisual(data1, true);
      } else if (cmd === 8 || (cmd === 9 && data2 === 0)) {
        msgDesc += ` -> NOTA OFF: ${data1}`;
        triggerVisual(data1, false);
      } else if (cmd === 11) {
        msgDesc += ` -> CC: ${data1} (Val: ${data2})`;
        document.getElementById('selected-control').value = `CC ${data1} (Val: ${data2})`;
      }

      log(msgDesc);
    }

    function triggerVisual(note, active) {
      // Evidenzia il primo pad libero o associato
      const el = document.getElementById('pad-index-0');
      if (el) {
        if (active) el.classList.add('active');
        else el.classList.remove('active');
      }
    }

    function log(msg) {
      const l = document.getElementById('log');
      l.innerHTML = `> ${msg}<br>` + l.innerHTML;
    }

    initMIDI();
  </script>
</body>
</html>
